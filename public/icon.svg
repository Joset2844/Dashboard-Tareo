<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="gearGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Subtle grid pattern -->
  <path d="M 64 0 L 64 512 M 128 0 L 128 512 M 192 0 L 192 512 M 256 0 L 256 512 M 320 0 L 320 512 M 384 0 L 384 512 M 448 0 L 448 512 M 0 64 L 512 64 M 0 128 L 512 128 M 0 192 L 512 192 M 0 256 L 512 256 M 0 320 L 512 320 M 0 384 L 512 384 M 0 448 L 512 448" stroke="#334155" stroke-opacity="0.15" stroke-width="1.5" />

  <!-- Outer Gauge Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#1e293b" stroke-width="24" stroke-linecap="round" />
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#accentGrad)" stroke-width="24" stroke-dasharray="750 1000" stroke-dashoffset="-40" stroke-linecap="round" filter="url(#glow)" />

  <!-- Concentric inner glow ring -->
  <circle cx="256" cy="256" r="118" fill="#0f172a" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.4" />

  <!-- Speedometer / Factory Graphic -->
  <!-- Gear cog teeth in background center -->
  <g fill="#1e293b" opacity="0.6">
    <rect x="244" y="160" width="24" height="32" rx="4" />
    <rect x="244" y="320" width="24" height="32" rx="4" />
    <rect x="160" y="244" width="32" height="24" rx="4" />
    <rect x="320" y="244" width="32" height="24" rx="4" />
  </g>

  <!-- Industrial OEE Pulse / Sparkline Wave -->
  <path d="M 176 268 L 216 268 L 236 210 L 264 305 L 284 240 L 304 268 L 336 268" fill="none" stroke="#38bdf8" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Needle / Apex dot -->
  <circle cx="236" cy="210" r="9" fill="#10b981" />
  <circle cx="284" cy="240" r="7" fill="#6366f1" />

  <!-- Badge Text: OEE -->
  <text x="256" y="360" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#f8fafc" letter-spacing="4" text-anchor="middle">OEE</text>
  <text x="256" y="388" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#38bdf8" letter-spacing="2" text-anchor="middle">INDUSTRIAL</text>
</svg>
