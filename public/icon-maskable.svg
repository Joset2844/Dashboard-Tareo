<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="accentGradMask" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glowMask" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full bleed Background for maskable icon -->
  <rect width="512" height="512" fill="url(#bgMask)" />

  <!-- Subtle grid pattern -->
  <path d="M 64 0 L 64 512 M 128 0 L 128 512 M 192 0 L 192 512 M 256 0 L 256 512 M 320 0 L 320 512 M 384 0 L 384 512 M 448 0 L 448 512 M 0 64 L 512 64 M 0 128 L 512 128 M 0 192 L 512 192 M 0 256 L 512 256 M 0 320 L 512 320 M 0 384 L 512 384 M 0 448 L 512 448" stroke="#334155" stroke-opacity="0.15" stroke-width="1.5" />

  <!-- Scaled slightly inside safe zone (r=140) -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="#1e293b" stroke-width="20" stroke-linecap="round" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#accentGradMask)" stroke-width="20" stroke-dasharray="660 880" stroke-dashoffset="-35" stroke-linecap="round" filter="url(#glowMask)" />

  <circle cx="256" cy="256" r="102" fill="#0f172a" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.4" />

  <!-- Industrial OEE Pulse / Sparkline Wave -->
  <path d="M 186 266 L 220 266 L 238 216 L 262 298 L 280 242 L 298 266 L 326 266" fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />

  <circle cx="238" cy="216" r="8" fill="#10b981" />
  <circle cx="280" cy="242" r="6" fill="#6366f1" />

  <!-- Badge Text: OEE -->
  <text x="256" y="348" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="900" fill="#f8fafc" letter-spacing="4" text-anchor="middle">OEE</text>
  <text x="256" y="372" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="2" text-anchor="middle">INDUSTRIAL</text>
</svg>
